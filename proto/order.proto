syntax = "proto3";

package order;

// Enumeration of possible order lifecycle states
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  REJECTED = 3;
  CANCELLED = 4;
}

// Single item inside an order response
message OrderItem {
  string id = 1;
  string order_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  double unit_price = 5;
}

// Item input for order creation
message CreateOrderItemInput {
  string product_id = 1;
  int32 quantity = 2;
}

// Request to create a new order
message CreateOrderRequest {
  string user_id = 1;
  repeated CreateOrderItemInput items = 2;
}

// Request to get an order by ID
message GetOrderRequest {
  string id = 1;
  string user_id = 2;
}

// Request to list orders with pagination
message ListOrdersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

// Request to cancel an existing order
message CancelOrderRequest {
  string id = 1;
  string user_id = 2;
}

// Standard order response
message OrderResponse {
  string id = 1;
  string user_id = 2;
  string status = 3;
  double total_amount = 4;
  repeated OrderItem items = 5;
  string created_at = 6;
  string updated_at = 7;
}

// Paginated orders response
message ListOrdersResponse {
  repeated OrderResponse orders = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

// gRPC Service definition for Order Service
service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
}
